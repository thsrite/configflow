# L6 lab layout, sourced by every script under pve/ (bash).
# Guest ID n uses address 10.97.0.(n-100) on the isolated bridge cfgt.
# Only the guests listed here are ever created, started, stopped or destroyed
# by these scripts, and only after they are recorded in $OWNER.

LAB=/root/cf-gwip-lab
WORK=$LAB/l6
OWNER=$LAB/l6-owner.json
BRIDGE=cfgt
NET=10.97.0
GW=$NET.1
INFRA_IP=$NET.151          # lab resolver, registry, static HTTP, WebDAV
PANEL_IP=$NET.150
CHR_IP=$NET.156
VIP_NATIVE=$NET.249        # DNS HA pair on CT 254/255 (native keepalived)
VIP_DOCKER=$NET.248        # Docker HA pair on VM 258/259
REGISTRY=$INFRA_IP:5000
HTTP=http://$INFRA_IP:8090
WEBDAV=http://$INFRA_IP:8091

ALPINE_TMPL=local:vztmpl/alpine-3.24-default_20261105_amd64.tar.xz
DEBIAN_TMPL=local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
DEBIAN_CLOUD=$LAB/img/debian12.qcow2
CHR_IMG=$LAB/chr/chr-7.25.1.img
MIRROR=https://mirrors.aliyun.com   # Debian packages (TUNA/USTC answered 403 on 2026-11-23)
# Alpine repositories over plain HTTP (packages are signature-checked): busybox wget/ssl_client and
# apk's own fetcher stall on HTTPS transfers from the lab (curl over HTTPS is fine), 2026-11-23.
ALPINE_REPO=http://mirrors.aliyun.com
SSH_KEY=$WORK/id_l6

# Never touched by L6 (production guests and other work on this host).
PROTECTED="100 101 102 103 104 105 106 107 108 111 112 116 130 240 1001"

# id|kind|name|os|memory MB|cores|disk GB|role
GUESTS="
250|lxc|cf-l6-panel|alpine|2048|2|12|panel container (last Python image, then the Go image) on Docker
251|lxc|cf-l6-infra|alpine|768|1|16|lab resolver (mosdns, DoH-by-IP), registry :5000, static HTTP :8090, WebDAV :8091
252|lxc|cf-l6-gw-deb|debian|512|1|4|side gateway: Mihomo Agent, systemd (pilot)
253|lxc|cf-l6-gw-alp|alpine|512|1|4|side gateway: Mihomo Agent, OpenRC
254|lxc|cf-l6-dns-a|debian|384|1|4|DNS HA member A: OxiDNS + keepalived, systemd
255|lxc|cf-l6-dns-b|alpine|384|1|4|DNS HA member B: OxiDNS + keepalived, OpenRC
256|qemu|cf-l6-chr|chr|512|1|0|RouterOS CHR 7.25.1, main router role (REST)
257|lxc|cf-l6-client|debian|256|1|4|client probes: dig loops on the VIPs, curl through the gateways
258|qemu|cf-l6-dock-a|debian-cloud|1024|2|12|Docker HA member A (s6 Agent image), Docker CE
259|qemu|cf-l6-dock-b|debian-cloud|1024|2|12|Docker HA member B (s6 Agent image), Docker CE
"

guest_field() { # guest_field <id> <1-based field>
  printf '%s\n' "$GUESTS" | awk -F'|' -v id="$1" -v f="$2" '$1 == id { print $f }'
}
guest_ids() { printf '%s\n' "$GUESTS" | awk -F'|' 'NF > 1 { print $1 }'; }
guest_ip() { echo "$NET.$(( $1 - 100 ))"; }

registered() { # registered <id>: recorded in the owner file and not protected
  case " $PROTECTED " in *" $1 "*) return 1;; esac
  [ -f "$OWNER" ] && python3 -c 'import json,sys; sys.exit(0 if sys.argv[2] in json.load(open(sys.argv[1]))["guests"] else 1)' "$OWNER" "$1"
}
require_registered() { registered "$1" || { echo "refusing: guest $1 is not an L6 guest in $OWNER" >&2; exit 1; }; }
gexec() { # gexec <ct id> <command...>: run in a CT with a sane PATH and shell (pct exec inherits zsh/PATH from root)
  local id=$1; shift
  require_registered "$id"
  pct exec "$id" -- env SHELL=/bin/sh PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin "$@"
}

pin_mirror() { # pin_mirror <ct>: resolve the package mirror on PVE (home DNS, not lab traffic) into the CT's hosts
  local host=${MIRROR#https://} ip
  ip=$(getent ahostsv4 "$host" | awk 'NR==1 {print $1}')
  [ -n "$ip" ] || { echo "cannot resolve $host on PVE" >&2; exit 1; }
  gexec "$1" sh -c "grep -v ' $host\$' /etc/hosts > /etc/hosts.new; echo '$ip $host' >> /etc/hosts.new; cat /etc/hosts.new > /etc/hosts; rm /etc/hosts.new"
}

# Package installs inside guests: mirror transfers from the lab sometimes stall on a
# dead connection (apk has no read timeout), so every attempt is bounded and retried.
APK_ADD='for i in 1 2 3 4; do rm -f /lib/apk/db/lock; timeout 300 apk add -q "$@" && exit 0; echo "apk retry $i" >&2; sleep 3; done; exit 1'
apk_add() { # apk_add <ct> <package...>
  local ct=$1; shift
  gexec "$ct" sh -c "$APK_ADD" apk_add "$@"
}
