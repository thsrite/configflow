name: Regression checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keep the existing required check name (`backend`) for branch protection.
  backend:
    name: backend (Go server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check formatting
        run: |
          out=$(gofmt -l internal/ tools/ cmd/)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - name: Vet and build tags
        run: |
          go vet ./...
          for tag in configflow_proddiff configflow_difftest; do
            go build -tags "$tag" ./...
            go vet -tags "$tag" ./internal/lifecycle/... ./cmd/...
          done
      - name: Run Go server tests (race)
        run: go test -race -timeout=60m ./...

  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run complete frontend shard
        run: >-
          npm test -- --shard=${{ matrix.shard }}/2
          --reporter=default --reporter=json
          --outputFile=../.ci-results/frontend-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results-${{ matrix.shard }}
          path: .ci-results/frontend-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: frontend types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Collect complete frontend test inventory
        run: |
          mkdir -p ../.ci-results
          npx vitest list --filesOnly --json > ../.ci-results/frontend-all.json
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-inventory
          path: .ci-results/frontend-all.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend:
    if: ${{ always() }}
    needs: [frontend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend checks
        env:
          TEST_RESULT: ${{ needs.frontend-tests.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: frontend-*
          path: .ci-results
          merge-multiple: true
      - name: Verify shard tooling
        run: node --test scripts/ci/test_shard_tests.mjs
      - name: Verify complete, non-overlapping test coverage
        run: >-
          node scripts/ci/shard_tests.mjs validate
          --expected .ci-results/frontend-all.json --expected-key file
          --shard-key testResults.name
          --path-prefix frontend/tests
          .ci-results/frontend-1.json .ci-results/frontend-2.json

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/agents/go-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/agents/go-agent/go.mod
          cache-dependency-path: backend/agents/go-agent/go.sum
      - run: go test -race ./...

  node-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/node-probe/go.mod
          cache-dependency-path: backend/node-probe/go.sum
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -o configflow-node-probe .
