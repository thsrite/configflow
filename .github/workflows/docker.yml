name: Docker ConfigFlow Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'server/**'
      - 'backend/agents/go-agent/**'
      - 'backend/node-probe/**'
      - 'frontend/**'
      - 'docker/Dockerfile'
      - 'docker/supervisord.conf'
      - 'docker/sub-store-start.sh'
      - 'docker/configflow-start.sh'
      - 'docker/configflow-healthcheck.sh'
      - 'docker/auto_update.py'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# 同一分支 / tag 只保留最新一次构建，新推送会取消还在排队或运行中的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE || 'thsrite' }}/config-flow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "git_commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          # metadata-action 默认 latest=auto 会在推正式版本标签时自动加 latest，
          # 绕过下面的 PUBLISH_LATEST 开关（O14 D3）；latest 只由下面的 raw 规则决定。
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ vars.PUBLISH_LATEST == 'true' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}

      # autoupdate 镜像（target: autoupdate，容器启动时按分支源码重建 Go server/前端/Agent）。
      # 标签与 runtime 同一套 D3 规则：
      # - 版本标签（含预发布）推 `<版本>-autoupdate`，例如 `2.0.0-rc.1-autoupdate`，固定且可回溯；
      # - 浮动标签 `autoupdate` 是旧 Python autoupdate 用户正在跟的那个，与 `latest` 同一开关
      #   （PUBLISH_LATEST=true 且不是预发布）才移动：观察期结束前它不会指向 Go 版。
      - name: Extract autoupdate metadata
        id: meta_autoupdate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-autoupdate,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=autoupdate,enable=${{ vars.PUBLISH_LATEST == 'true' && !contains(github.ref_name, '-') }}

      - name: Build and push autoupdate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: autoupdate
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ steps.meta_autoupdate.outputs.tags != '' }}
          tags: ${{ steps.meta_autoupdate.outputs.tags }}
          labels: ${{ steps.meta_autoupdate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
