name: Docker Agent Build

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
  push:
    # 版本标签（含预发布）推 `config-flow-agent:<版本>`，与 docker.yml 的面板版本标签一一对应；
    # 面板发布镜像把它写进生成的 Docker Agent 命令（tag 推送不受下面 paths 过滤）。
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'backend/agents/go-agent/**'
      - 'docker/Dockerfile.agent'
      - 'docker/docker-agent-entrypoint*.sh'
      - '.github/workflows/docker-agent.yml'

# 同一分支 / tag 只保留最新一次构建，新推送会取消还在排队或运行中的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE || 'thsrite' }}/config-flow-agent

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore upstream digest cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/agent-upstream-digests.txt
          key: agent-upstream-digests-${{ github.run_id }}
          restore-keys: |
            agent-upstream-digests-

      - name: Check upstream images
        id: check
        env:
          PUBLISH_LATEST: ${{ vars.PUBLISH_LATEST }}
        run: |
          set -eu

          # 没有版本标签的构建（main 推送、定时、手动）只发布浮动的 `latest`。
          # 观察期内 `latest` 冻结在 Python 时期的 Agent（PUBLISH_LATEST 不是 true），这些构建直接跳过。
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && [ "${PUBLISH_LATEST:-}" != "true" ]; then
            echo "PUBLISH_LATEST is not true: config-flow-agent:latest stays frozen, nothing to publish for ${GITHUB_REF}."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            printf 'mihomo '
            docker buildx imagetools inspect metacubex/mihomo:latest | awk '/Digest:/ {print $2; exit}'
            printf 'mosdns '
            docker buildx imagetools inspect irinesistiana/mosdns:latest | awk '/Digest:/ {print $2; exit}'
            printf 'oxidns '
            docker buildx imagetools inspect svenshi/oxidns:v1.6.1 | awk '/Digest:/ {print $2; exit}'
          } > /tmp/agent-upstream-digests.next

          if [ ! -f /tmp/agent-upstream-digests.txt ] || ! cmp -s /tmp/agent-upstream-digests.txt /tmp/agent-upstream-digests.next; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload upstream digests
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-upstream-digests
          path: /tmp/agent-upstream-digests.next
          if-no-files-found: error
          retention-days: 1

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          platforms: ${{ matrix.platform.arch }}
          pull: true
          outputs: type=image,name=${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 标签规则：
      # - 版本标签（含预发布）推 `<版本>`（semver，与 docker.yml 同一规则，例如 `3.0.0-rc.1`）和主版本号 `3`。
      #   Agent 的 `3` 也跟预发布走：本地、分支和 autoupdate 构建的面板没有配套版本，生成的命令用
      #   `config-flow-agent:3`（version.DefaultAgentImage），3.0.0 正式版之前它也必须存在。
      # - `latest` 与 docker.yml 同一开关：PUBLISH_LATEST=true 时随正式版标签和 main 推送、定时、手动构建移动；
      #   开关关闭时没有版本标签的构建直接跳过（见 check-upstream），`latest` 冻结在 Python 时期。
      - name: Major version
        id: major
        run: |
          major=""
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.[0-9]+\.[0-9]+ ]]; then
            major="${BASH_REMATCH[1]}"
          fi
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.major.outputs.major }},enable=${{ steps.major.outputs.major != '' }}
            type=raw,value=latest,enable=${{ vars.PUBLISH_LATEST == 'true' && !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          if [ -z "$TAGS" ]; then
            echo "No image tag for ${GITHUB_REF}: version tags must be semver (vX.Y.Z[-pre])." >&2
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<<"$TAGS"
          sources=()
          for digest in *; do
            sources+=("${REGISTRY_DOCKERHUB}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker buildx imagetools inspect "$tag"; fi
          done <<<"$TAGS"

  save-upstream-digests:
    runs-on: ubuntu-latest
    needs:
      - check-upstream
      - merge
    if: github.event_name == 'schedule' && needs.check-upstream.outputs.should_build == 'true'
    steps:
      - name: Download upstream digests
        uses: actions/download-artifact@v4
        with:
          name: agent-upstream-digests
          path: /tmp

      - name: Move digest file
        run: mv /tmp/agent-upstream-digests.next /tmp/agent-upstream-digests.txt

      - name: Save upstream digest cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/agent-upstream-digests.txt
          key: agent-upstream-digests-${{ github.run_id }}
