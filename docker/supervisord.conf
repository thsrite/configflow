[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; supervisorctl 用于内置 Sub-Store 按需启停及在线更新后重启
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:sub-store]
; ConfigFlow server starts this service on demand (or at boot in always-on mode).
command=/usr/local/bin/sub-store-start.sh
autostart=false
autorestart=true
priority=100
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:configflow]
; Go server serves both the REST/MCP API and the frontend SPA on the web port.
; Default CONFIGFLOW_SHUTDOWN_GRACE_SECONDS=8 drains within Docker's 10s stop timeout.
command=/usr/local/bin/configflow
directory=/app
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=9
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
